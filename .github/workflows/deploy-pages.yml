name: Deploy Vue to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - run: npm ci

      # Dados: public/data/clubedorobson.json (scripts/export_snapshot.py), já commitado
      - name: Build
        env:
          PUBLIC_PATH: /${{ github.event.repository.name }}/
          NODE_OPTIONS: --openssl-legacy-provider
        run: npx vue-cli-service build --dest dist --no-lint

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: front-end/dist
          publish_branch: gh-pages
